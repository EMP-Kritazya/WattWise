# Backtest assumptions (owner: Kritazya). DATA_AND_PROOF.md "Distributing historical load onto devices" + "Sensitivity".
#
# Format: YAML written in JSON flow style (valid YAML 1.2) so `backtest/assumptions.py` reads it with the standard library
# (PyYAML is not installed in backend/.venv). Only full-line comments (lines starting with "#") are allowed.
#
# Sources (decided 2026-10-24, carried here from the gitignored myTestsReport/ so the team sees them):
# - dataset: NREL ComStock comstock_amy2018_release_3, upgrade 45 (electric kitchen), bldg_id 5847, San Francisco County
#   (G0600750), 2,000 ft2 full-service restaurant, 52.0 kW peak, 251 MWh/yr (DATASET_AND_TARIFF_SELECTION.md).
# - tariff: PG&E B-19 Secondary Voluntary, URDB 69de8cdb02f684104e01267d (converted by data/tariff_urdb.py).
# - step 1: hvac = cooling + fans + heating + pumps + heat_rejection + heat_recovery, split equally over the hvac units;
#   lights = interior_lighting + exterior_lighting; interior_equipment -> the nine kitchen devices (DATA_AND_PROOF.md Step 1).
#   refrigeration, water_systems and pv are 0 for bldg 5847; the loader raises if they are not (they have no mapping).
#   The float32 residual of the file (total - sum of end uses, at most 3.0e-6 kWh per row) is added to interior_equipment
#   before step 2, so every row's devices sum exactly to `out.electricity.total` (the baseline is never altered).
# - step 2 shares: appliance-split.md section 3 "interior_equipment" (energy-weighted rated_kw x duty, sum 100.0).
# - day_offset 2919 days = 417 weeks: 2018-01-01 (Mon) -> 2025-12-29 (Mon). It also lines up DST: 2018-03-11 -> 2026-03-08 and
#   2018-11-04 -> 2026-11-01, both the real 2026 DST dates, so the kitchen's wall-clock schedule is kept exactly.
#   Consequence: the replay calendar is 2025-12-29 .. 2026-12-28; January 2026 is partial (warm-up = first 28 days, scored
#   from 26 Jan) and December 2026 is partial too (1-28 Dec; the dataset ends there).
# - overflow "raise": a device block above its catalog rated_kw stops the loader (never clipped).
#
# Sensitivity ids (DATA_AND_PROOF.md): low_flex (half the flexibility), heavy_equipment (+20 % draw), bad_forecast (+/-20 %
# forecast noise). zero_flex is the "zero-flexibility run saves 0" check, not a sensitivity case.
{
  "dataset": {
    "file": "dataset/comstock/timeseries/5847-45.parquet",
    "day_offset": 2919,
    "warmup_days": 28
  },
  "tariff": {
    "file": "dataset/tariffs/pge_b19_secondary_voluntary_urdb_69de8cdb02f684104e01267d.json"
  },
  "kitchen": {
    "name": "Demo Café",
    "equipment": [
      { "type_id": "hvac", "count": 2, "importance": "flexible", "limits": { "min_power_pct": 40, "max_reduce_min": 30 } },
      { "type_id": "walk_in_cooler", "count": 1, "importance": "flexible", "limits": { "min_power_pct": 50, "max_reduce_min": 30 } },
      { "type_id": "reach_in_fridge", "count": 1, "importance": "always_on", "limits": {} },
      { "type_id": "freezer", "count": 1, "importance": "always_on", "limits": {} },
      { "type_id": "ice_machine", "count": 1, "importance": "deferrable", "limits": { "max_delay_min": 60, "must_finish_by": "22:00" } },
      { "type_id": "fryer", "count": 1, "importance": "always_on", "limits": {} },
      { "type_id": "oven", "count": 1, "importance": "always_on", "limits": {} },
      { "type_id": "grill", "count": 1, "importance": "always_on", "limits": {} },
      { "type_id": "dishwasher", "count": 1, "importance": "deferrable", "limits": { "max_delay_min": 60, "must_finish_by": "19:30" } },
      { "type_id": "water_heater", "count": 1, "importance": "flexible", "limits": { "min_power_pct": 40, "max_reduce_min": 30 } },
      { "type_id": "lights", "count": 1, "importance": "always_on", "limits": {} }
    ],
    "peak_mode": "cap",
    "peak_cap_kw": 40.0,
    "operating_hours": { "open": "10:00", "close": "22:00" },
    "location": { "lat": 37.8, "lon": -122.44, "label": "Marina, San Francisco" },
    "owner_preferences": "Keep the dining room comfortable during dinner service.",
    "authority": { "enabled": true, "max_cap_overrun_kw": 3.0, "max_extra_delay_min": 20, "max_extra_reduce_min": 15, "may_go_below_min_power": false },
    "run_days": 1,
    "seed": 42
  },
  "step1": {
    "hvac": ["cooling", "fans", "heating", "pumps", "heat_rejection", "heat_recovery"],
    "lights": ["interior_lighting", "exterior_lighting"],
    "interior_equipment": ["interior_equipment"],
    "must_be_zero": ["refrigeration", "water_systems", "pv"]
  },
  "assumptions": {
    "base": {
      "flex_scale": 1.0,
      "draw_scale": 1.0,
      "forecast_noise_pct": 0.0,
      "overflow": "raise",
      "interior_equipment": {
        "walk_in_cooler": 7.4,
        "reach_in_fridge": 1.4,
        "freezer": 4.1,
        "ice_machine": 6.5,
        "fryer": 10.4,
        "oven": 12.9,
        "grill": 21.7,
        "dishwasher": 8.6,
        "water_heater": 27.0
      }
    },
    "low_flex": { "inherits": "base", "flex_scale": 0.5 },
    "heavy_equipment": { "inherits": "base", "draw_scale": 1.2 },
    "bad_forecast": { "inherits": "base", "forecast_noise_pct": 20.0 },
    "zero_flex": { "inherits": "base", "flex_scale": 0.0 },
    "base_redistribute_proposal": {
      "inherits": "base",
      "overflow": "redistribute",
      "status": "PROPOSAL, not approved: a device block above rated_kw is capped at rated_kw and the excess is spread over the other interior_equipment devices in proportion to their shares (the row total is unchanged). Exists only so the pipeline can be exercised on the full year while `base` raises."
    }
  }
}
