; WattWise ESP32 hub (docs/design/CONVEX_AND_ESP32.md). Build: `pio run`, flash: `pio run -t upload`, logs: `pio device monitor`.
; WiFi and the Convex URL come from include/secrets.h (gitignored; copy include/secrets.example.h).

[platformio]
default_envs = esp32s3

[env]
; Arduino-ESP32 core 3.2.0 (convex-esp32 needs >= 3.2 for WiFiClientSecure::setCACertBundle). The stock `espressif32`
; platform still ships core 2.x, so this is the pioarduino build of the platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/get-convex/convex-esp32.git
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit INA219@^1.2.3
build_flags =
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    ; Which hub this board is in Convex (`device_map.hub_id`, `hubs.hub_id`).
    -DHUB_ID=\"esp32_1\"
    ; `delay` holds a channel off for value sim minutes; at SIM_SPEED x that is value * 60 / SIM_SPEED real seconds.
    -DSIM_SPEED=120
    ; Physical limit of the loads: a small DC fan stalls below ~20 % duty. `reduce` below this is clamped (out_of_range).
    -DMIN_DUTY_PCT=20

; ESP32-S3 DevKitC-1 with PSRAM (N8R2 / N16R8). Preferred.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

; Any ESP32-S3 DevKitC-1 without PSRAM: the library falls back to an 8 KB receive buffer, which is plenty here.
[env:esp32s3_nopsram]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
